# Packaging baseline for jeltz (T22). One declarative file for dependencies,
# split by audience:
#
#   [project].dependencies  - needed to RUN the shipped review engine, in this
#                             checkout or in a consumer repo that installed it
#                             (T33). These are what a consumer provisions.
#   [dependency-groups].dev - needed to DEVELOP jeltz itself. PEP 735 groups
#                             are not part of the distribution metadata, so a
#                             consumer can never pull them by accident.
#
# jeltz ships by file copy (install.sh), never as a wheel of its own code, so
# the build backend is here only to make the dependency metadata installable:
# `packages = []` keeps the built distribution metadata-only. That also avoids
# putting a top-level module named `review` into anyone's site-packages.
#
# The [tool.ruff] section below is load-bearing twice over (T24). It declares
# the standard `make lint` enforces, and - because hooks/lib/repo-mode.sh
# derives its enforcement regime from a git-TRACKED ruff config - committing it
# promotes this whole tree from diff-scoped to whole-file hook enforcement.
# That is why it arrived with the cleanup it implies rather than with packaging.
#
# It is NOT the rule set jeltz ships to consumers. hooks/ruff.sh deliberately
# runs an abbreviated set so red/green/refactor does not thrash on half-written
# code; this is the repo's own, stricter standard.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jeltz"
version = "0.1.0"
description = "Hooks, skills, and the in-session review loop shipped into consumer projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

# Where first-party code lives, for import classification. This is the repo
# root, not ["review", "tests"]: those are the packages, and pointing src AT
# them tells ruff to look for first-party modules INSIDE them, which demotes
# `tests.conftest` to third-party and reorders 14 import blocks wrongly.
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]

# E501 is the formatter's job - it wraps to line-length, and a lint error for
# what the formatter has already decided is noise. B008 forbids function calls
# in argument defaults, which pytest and dataclass idioms use deliberately.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["review"]
